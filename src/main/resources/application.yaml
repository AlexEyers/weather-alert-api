server:
  port: ${PORT:8081} # Check for environment variable called PORT, if exists use that value, else use 8081

spring:
  datasource:
    url: jdbc:h2:mem:weatherdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

weather:
  api:
    base-url: https://api.weatherapi.com/v1
    key: ${WEATHER_API_KEY}